<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up – Fitness World Happiness Space</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div id="header"></div>

  <main class="main-content">
    <div class="auth-wrapper">
      <div class="auth-card">
        <h1>Create Account</h1>
        <p class="subtitle">Join Fitness World Happiness Space today</p>

        <div id="alert" class="alert" style="display: none;"></div>

        <form id="signupForm">
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" required placeholder="John Doe" autocomplete="name">
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email">
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="6" placeholder="••••••••" autocomplete="new-password">
            <p class="password-hint">Minimum 6 characters</p>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
            Create Account
          </button>
        </form>

        <p class="auth-footer">
          Already have an account? <a href="login.html">Login</a>
        </p>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <!-- More reliable Supabase CDN (UMD build) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>

  <script>
    // Redirect if already logged in
    (async () => {
      if (window.auth) {
        const session = await window.auth.getSession();
        if (session) window.location.href = 'dashboard.html';
      }
    })();

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alert');

      // Reset alert
      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      const result = await window.auth.signUp(email, password, fullName);

      if (result.success) {
        alertBox.className = 'alert alert-success';
        alertBox.textContent = 'Account created successfully! Redirecting...';
        alertBox.style.display = 'block';

        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1200);
      } else {
        alertBox.className = 'alert alert-error';
        alertBox.textContent = result.error || 'Something went wrong. Please try again.';
        alertBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
