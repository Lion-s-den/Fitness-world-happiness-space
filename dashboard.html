<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – Fitness World Happiness Space</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div id="header"></div>

  <main class="main-content">
    <div class="container">
      <div class="welcome-banner" id="welcomeBanner">
        <h2>Welcome back!</h2>
        <p>Loading your membership info...</p>
      </div>

      <div class="stats-grid">
        <div class="stat-card membership">
          <h3>Membership Status</h3>
          <div class="value" id="membershipStatus">—</div>
        </div>
        <div class="stat-card">
          <h3>Email</h3>
          <div class="value" id="userEmail" style="font-size: 1.1rem;">—</div>
        </div>
        <div class="stat-card">
          <h3>Member Since</h3>
          <div class="value" id="memberSince" style="font-size: 1.1rem;">—</div>
        </div>
      </div>

      <div class="card">
        <h3 class="mb-4">Quick Actions</h3>
        <div class="quick-actions">
          <a href="profile.html" class="btn btn-primary">Edit Profile</a>
          <button class="btn btn-outline" disabled title="Coming soon">Start Camera Session</button>
          <button class="btn btn-outline" disabled title="Coming soon">AI Exercise Suggestions</button>
        </div>
        <p style="margin-top: 20px; color: var(--gray-500); font-size: 0.9rem;">
          Camera monitoring and AI suggestions will be available in the next phase.
        </p>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/protected.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>

  <script>
    async function loadDashboard() {
      const profile = await window.auth.getUserProfile();

      if (!profile) return;

      document.getElementById('welcomeBanner').innerHTML = `
        <h2>Welcome back, ${profile.full_name || 'Member'}!</h2>
        <p>Ready to move better and feel happier today?</p>
      `;

      const status = (profile.membership_status || 'free').toLowerCase();
      document.getElementById('membershipStatus').innerHTML = 
        `<span class="badge badge-${status}">${status}</span>`;

      document.getElementById('userEmail').textContent = profile.email || '—';

      if (profile.created_at) {
        const date = new Date(profile.created_at);
        document.getElementById('memberSince').textContent = date.toLocaleDateString('en-US', {
          year: 'numeric', month: 'short', day: 'numeric'
        });
      } else {
        document.getElementById('memberSince').textContent = 'Just now';
      }
    }

    setTimeout(loadDashboard, 400);
  </script>
</body>
</html>
