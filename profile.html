<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile – Fitness World Happiness Space</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div id="header"></div>

  <main class="main-content">
    <div class="container">
      <div class="page-header">
        <h1>Your Profile</h1>
        <p>Manage your membership information</p>
      </div>

      <div class="card" style="max-width: 520px;">
        <div id="alert" class="alert" style="display: none;"></div>

        <form id="profileForm" class="profile-form">
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" required>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" disabled>
          </div>

          <div class="form-group">
            <label for="membership">Membership Status</label>
            <input type="text" id="membership" name="membership" disabled>
          </div>

          <button type="submit" class="btn btn-primary" id="saveBtn">
            Save Changes
          </button>
        </form>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/protected.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>

  <script>
    async function loadProfile() {
      const profile = await window.auth.getUserProfile();
      if (!profile) return;

      document.getElementById('fullName').value = profile.full_name || '';
      document.getElementById('email').value = profile.email || '';
      document.getElementById('membership').value = (profile.membership_status || 'free').toUpperCase();
    }

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value.trim();
      const saveBtn = document.getElementById('saveBtn');
      const alertBox = document.getElementById('alert');

      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';
      alertBox.style.display = 'none';

      const result = await window.auth.updateProfile({ full_name: fullName });

      if (result.success) {
        alertBox.className = 'alert alert-success';
        alertBox.textContent = 'Profile updated successfully!';
        alertBox.style.display = 'block';
      } else {
        alertBox.className = 'alert alert-error';
        alertBox.textContent = result.error || 'Failed to update profile.';
        alertBox.style.display = 'block';
      }

      saveBtn.disabled = false;
      saveBtn.textContent = 'Save Changes';
    });

    setTimeout(loadProfile, 300);
  </script>
</body>
</html>
